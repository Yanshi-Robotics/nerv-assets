<text x="58" y="474" font-size="13.5" font-weight="700" fill="#b45309" text-anchor="start">ECOSYSTEM BOUNDARY (4 REPOS)</text>
<text x="58" y="502" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">• nerv (Core Platform): Brain Core, MCP server, Operator Console, Runtime SDK &amp; safety stops.</text>
<text x="58" y="528" font-size="13.5" font-weight="400" fill="#0f172a" text-anchor="start">• nerv-assets (This Repo): Worlds, furniture &amp; bodies only.  • nerv-policies: ONNX weights &amp; contracts.  • nerv-harness: Swarm host.</text>
